<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Les Pilliers — en ligne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="frame"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="game.js"></script>
<script>
  // Interface ordinateur (voir style.css, min-width:900px) : voir index.html du
  // site principal pour la même logique, notes détaillées là-bas.
  function fitFrameScale(){
    const DESIGN_W = 480, DESIGN_H = 700, MAX_SCALE = 2.2;
    const scale = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H, MAX_SCALE);
    document.documentElement.style.setProperty('--app-scale', scale);
  }
  fitFrameScale();
  window.addEventListener('resize', fitFrameScale);
</script>
</body>
</html>
